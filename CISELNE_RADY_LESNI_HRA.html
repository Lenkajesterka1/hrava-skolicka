*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Verdana,sans-serif;color:#482a20;min-height:100vh;background:linear-gradient(#a5e5ff 0%,#dbf7ff 38%,#bdeca5 39%,#8fcd6b 100%);overflow-x:hidden}body:before{content:'☀️';position:fixed;top:12px;left:3%;font-size:90px;filter:drop-shadow(0 4px 4px #ffffff66);pointer-events:none}body:after{content:'🌳 🌼 🌿 🌷 🦋 🌼 🌳';position:fixed;bottom:-9px;left:0;width:100%;font-size:55px;letter-spacing:2vw;text-align:center;pointer-events:none;opacity:.8}.wrap{max-width:1190px;margin:auto;padding:20px 18px 85px;position:relative;z-index:1}.sign{background:linear-gradient(155deg,#ffda94,#e9a85f);border:7px solid #a96b36;box-shadow:0 8px 0 #7b4b29,0 14px 22px #42682966;border-radius:35px;text-align:center;padding:13px 20px;margin:0 auto 26px;max-width:760px}h1{margin:0;font-size:clamp(30px,5vw,54px);text-shadow:1px 2px #fff7db}header p{margin:4px 0;font-weight:800;font-size:clamp(16px,2.4vw,24px)}.controls{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.panel{background:#fff4d9ee;border:5px solid #b67d43;border-radius:25px;padding:15px 18px;box-shadow:0 7px 0 #84582c,0 10px 18px #446e3455;flex:1;min-width:290px;text-align:center}.panel h2{font-size:20px;margin:0 0 12px}.buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button{font-family:inherit;font-weight:900;cursor:pointer;touch-action:manipulation;border:3px solid #9b6b3c;border-radius:16px;color:#3c251d;box-shadow:0 4px 0 #966a48;background:#fff;font-size:21px;padding:10px 17px}button:focus-visible{outline:4px solid #246dbf;outline-offset:3px}button.selected{background:#8ddd73;box-shadow:0 4px 0 #4a8a3b;border-color:#4a8a3b}button:hover{filter:brightness(1.04)}.range button:nth-child(2){background:#b9eaff}.range button:nth-child(3){background:#f8c7db}.range button:nth-child(4){background:#e3d0ff}.range button.selected{background:#87d977;outline:4px solid #fff}.board{background:#fffaf0f5;border:7px solid #c58a4b;border-radius:34px;margin:28px auto 22px;box-shadow:0 9px 0 #9c693b,0 15px 20px #476f4266;padding:24px 22px;text-align:center;position:relative}.board:before{content:'🐿️';position:absolute;left:-35px;top:-50px;font-size:70px;transform:rotate(-10deg)}.instruction{font-size:clamp(23px,3vw,34px);font-weight:900;margin:0 0 21px}.sequence{display:flex;justify-content:center;gap:clamp(6px,1.3vw,15px);flex-wrap:wrap}.tile{width:clamp(58px,10vw,115px);height:clamp(68px,11vw,120px);display:flex;align-items:center;justify-content:center;border-radius:20px;border:4px solid #d7b27c;background:linear-gradient(#fff,#fce8bd);font-size:clamp(28px,5.2vw,62px);font-weight:900;box-shadow:0 5px 0 #ba8b53}.tile.blank{border:5px dashed #f0a52b;background:#fff0b4;color:#5b381e}.tile.filled{background:#b9edab;border-style:solid;border-color:#6fba56}.tile.wrong{background:#ffceca;border-color:#e96969}.answers{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.answers button{min-width:70px;min-height:66px;font-size:32px;background:#cceeff}.answers button:nth-child(3n){background:#ffe3a0}.answers button:nth-child(3n+2){background:#f8d3e5}.feedback{font-size:clamp(21px,3vw,29px);font-weight:900;min-height:40px;margin:20px 0 0}.next{background:linear-gradient(#79d751,#37a72d);color:white;border:4px solid #267c27;box-shadow:0 6px 0 #1f681d;font-size:clamp(21px,3vw,29px);padding:15px 38px}.bottom{text-align:center}.note{text-align:center;font-size:15px;font-weight:bold;margin-top:22px;background:#ffffffb0;display:table;margin-left:auto;margin-right:auto;padding:8px 14px;border-radius:14px}@media(max-width:650px){.wrap{padding:14px 8px 75px}.board{padding:20px 8px}.board:before{display:none}.tile{width:clamp(48px,16vw,78px);height:70px;font-size:32px}.panel{min-width:260px}button{padding:9px 12px}}

body::after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#e4faff33 0%,#ffffff08 45%,#c3ec8160 100%);z-index:-1;pointer-events:none}
.wrap{max-width:1300px;padding:18px 20px 70px}
.sign{position:relative;max-width:780px;margin:8px auto 22px;background:linear-gradient(160deg,#ffe3a2,#f5c780 54%,#e7ad66);border:7px solid #a76a37;box-shadow:inset 0 3px 0 #fff4d4,0 7px 0 #7b482b,0 13px 22px #365b3370;transform:rotate(-.4deg);padding:16px}
.sign h1{font-size:clamp(33px,5vw,60px);color:#55301d;letter-spacing:.3px}
.sign p{font-size:clamp(17px,2vw,25px)}
.woodland-animal{position:absolute;pointer-events:none;z-index:0;filter:drop-shadow(0 7px 7px #4d662b55);width:clamp(120px,20vw,230px);height:auto}
.animal-squirrel{top:20px;left:max(-10px,calc(50% - 710px))}
.animal-owl{top:12px;right:max(-10px,calc(50% - 710px))}
.controls,.board,.bottom,.note,.sign{z-index:1;position:relative}
.controls{gap:16px}
.panel{background:linear-gradient(#fff6dbf5,#ffdf9ef2);border:5px solid #a86c37;border-radius:26px;box-shadow:inset 0 3px 0 #fff7dc,0 6px 0 #86502a,0 12px 22px #34572e66;padding:14px 18px}
.panel h2{font-size:clamp(18px,2vw,23px);margin-bottom:13px}
button{border-radius:17px;transition:transform .12s,filter .12s;box-shadow:inset 0 2px 0 #ffffff9c,0 5px 0 #8c623e}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8c623e}
.range button:nth-child(1){background:#a2e76e}.range button:nth-child(2){background:#ffe28a}.range button:nth-child(3){background:#9ad9ff}.range button:nth-child(4){background:#ffb6d2}
.range button.selected,.buttons button.selected{outline:4px solid #fff;border-color:#2f8c40;box-shadow:0 0 0 6px #399744,0 5px 0 #3e7034}
.board{margin:24px auto 18px;padding:28px 18px 22px;background:linear-gradient(#fff9e8fa,#fff2d3f7);border:7px solid #a96c37;box-shadow:inset 0 3px 0 #fff,0 8px 0 #754323,0 14px 20px #4a632e6b}
.board::before{content:"🌿";font-size:52px;top:-30px;left:12px}
.instruction{color:#4d2c19}
.sequence{gap:clamp(7px,1.5vw,18px);align-items:center;flex-wrap:nowrap}
.tile{width:clamp(61px,11vw,135px);height:clamp(61px,11vw,135px);border-radius:50%;border:8px solid #a66a32;background:radial-gradient(circle at 35% 28%,#fff7e4 0%,#ffe7bb 65%,#d5a366 100%);box-shadow:inset 0 0 0 4px #f7d29a,0 7px 0 #83502b,0 9px 12px #73512d55;font-size:clamp(28px,5.2vw,62px);color:#482417;flex-shrink:0}
.tile.blank{border:7px dashed #e3a52d;background:#fffef7;box-shadow:inset 0 0 0 4px #ffe9a5,0 7px 0 #a97c40}
.tile.filled{background:#d7f3a5;border-color:#73ad3c}
.tile.wrong{background:#ffd4c7;border-color:#df6868}
.answers{margin-top:25px}
.answers button{font-size:clamp(25px,3vw,36px);min-width:80px;min-height:70px}
.feedback{margin-top:16px}
.next{background:linear-gradient(#7fe35c,#329e2a);border-color:#277a26;padding:16px 45px}
.note{background:#fff8e7e6;border:3px solid #d4a36b;font-size:16px}

(()=>{'use strict';let max=5,dir='up',correct=0,solved=false,previous='';const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);function select(){document.querySelectorAll('[data-max]').forEach(b=>{b.classList.toggle('selected',+b.dataset.max===max);b.setAttribute('aria-pressed',String(+b.dataset.max===max))});document.querySelectorAll('[data-dir]').forEach(b=>{b.classList.toggle('selected',b.dataset.dir===dir);b.setAttribute('aria-pressed',String(b.dataset.dir===dir))})}function newGame(){solved=false;$('feedback').textContent='';let direction=dir==='mix'?(Math.random()<.5?'up':'down'):dir;let len=max===5?4:5;let low= max===5?0:0;let start=rand(max-len+2);let values=Array.from({length:len},(_,i)=>start+i);if(direction==='down')values.reverse();let missing=rand(len-2)+1;correct=values[missing];let signature=direction+'-'+start+'-'+missing;if(signature===previous){missing=(missing%(len-2))+1;correct=values[missing]}previous=signature;$('instruction').textContent=direction==='up'?'⬆️ Doplň číslo ve vzestupné řadě':'⬇️ Doplň číslo v sestupné řadě';$('sequence').replaceChildren();values.forEach((v,i)=>{let el=document.createElement('div');el.className='tile'+(i===missing?' blank':'');el.textContent=i===missing?'':String(v);if(i===missing){el.id='missing';el.setAttribute('aria-label','Chybějící číslo')} $('sequence').append(el)});let options=new Set([correct]);let candidates=[];for(let v=Math.max(0,correct-5);v<=Math.min(max,correct+5);v++)if(v!==correct)candidates.push(v);while(options.size<Math.min(4,max+1)){let pool=candidates.filter(v=>!options.has(v));options.add(pool.length?pool[rand(pool.length)]:rand(max+1))}let arr=[...options].sort((a,b)=>a-b);$('answers').replaceChildren();arr.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('aria-label','Číslo '+n);b.addEventListener('click',()=>answer(n));$('answers').append(b)})}function answer(n){if(solved)return;const tile=$('missing');if(n===correct){solved=true;tile.textContent=n;tile.classList.remove('blank','wrong');tile.classList.add('filled');$('feedback').textContent='🌟 Výborně! Správně!';$('answers').querySelectorAll('button').forEach(b=>b.disabled=true)}else{tile.classList.add('wrong');$('feedback').textContent='💛 Zkus to ještě jednou!'}}$('ranges').addEventListener('click',e=>{let b=e.target.closest('[data-max]');if(b){max=+b.dataset.max;select();newGame()}});$('directions').addEventListener('click',e=>{let b=e.target.closest('[data-dir]');if(b){dir=b.dataset.dir;select();newGame()}});$('next').addEventListener('click',newGame);select();newGame()})();
