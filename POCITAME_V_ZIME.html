function nextObject(){const item=objects[objectCycle%objects.length];objectCycle++;return item}
function nextCargo(){const item=cargoObjects[cargoCycle%cargoObjects.length];cargoCycle++;return item}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const picture=(key,alt,cls='item')=>'<img class="'+cls+'" src="'+art[key]+'" alt="'+alt+'">';
function group(n,item){return Array.from({length:n},()=>picture(item[1],item[0])).join('')}
function say(ok){if(locked)return;if(ok){locked=true;completed++;feedback.textContent='🌟 Výborně! Správně!';score.textContent='Splněné úkoly: '+completed;const next=document.createElement('button');next.type='button';next.className='action next';next.textContent='➡️ Další úkol';next.addEventListener('click',newTask);actions.prepend(next)}else{feedback.textContent='☃️ Zkus to ještě jednou.'}}
function choices(vals,onChoose){const box=document.createElement('div');box.className='choices';vals.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.addEventListener('click',()=>{if(!locked)onChoose(v)});box.appendChild(b)});task.appendChild(box)}
function newTask(){locked=false;filled=0;feedback.textContent='';actions.innerHTML='<button type="button" class="action alt" id="new">🔄 Nový úkol</button>';document.getElementById('new').addEventListener('click',newTask);score.textContent='Splněné úkoly: '+completed;task.replaceChildren();
 if(mode==='count'){const item=nextObject();answer=rand(1,8);task.innerHTML='<div class="prompt">Kolik vidíš obrázků?</div><div class="display">'+group(answer,item)+'</div>';let vals=new Set([answer]);while(vals.size<3)vals.add(rand(1,8));choices([...vals].sort((a,b)=>a-b),v=>say(v===answer))}
 else if(mode==='basket'){answer=rand(1,8);const item=nextCargo();task.innerHTML='<div class="prompt">Nalož na sáňky '+answer+' obrázků.</div><p class="sub">Klikni na obrázek a přidávej ho na sáňky.</p><div><button type="button" id="add" class="picture-choice" aria-label="Přidat obrázek na sáňky">'+picture(item[1],item[0])+'</button></div><div class="sled-wrap"><div class="sled-title">🛷 Zimní sáňky</div><div class="sled-load" id="basket"></div><img class="sled-picture" src="'+art.sled+'" alt="Sáňky"></div><div class="counter">Na sáňkách: <span id="amount">0</span></div><div><button type="button" id="remove" class="action alt">↩️ Odebrat</button><button type="button" id="check" class="action">✓ Zkontrolovat</button></div>';const update=()=>{document.getElementById('basket').innerHTML=group(filled,item);document.getElementById('amount').textContent=filled};document.getElementById('add').addEventListener('click',()=>{if(!locked&&filled<8){filled++;update();feedback.textContent=''}});document.getElementById('remove').addEventListener('click',()=>{if(!locked&&filled>0){filled--;update();feedback.textContent=''}});document.getElementById('check').addEventListener('click',()=>say(filled===answer))}
 else if(mode==='flake'){const n=rand(1,8);answer=n;task.innerHTML='<div class="prompt">Která vločka má stejné číslo jako počet šišek?</div><div class="display">'+group(n,['šiška','cone'])+'</div>';const vals=new Set([n]);while(vals.size<3)vals.add(rand(1,8));const box=document.createElement('div');box.className='choices';[...vals].sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.type='button';b.className='picture-choice';b.setAttribute('aria-label','Vločka s číslem '+v);b.innerHTML='<div class="numberflake"><span>'+v+'</span></div>';b.addEventListener('click',()=>say(v===answer));box.appendChild(b)});task.appendChild(box)}
 else if(mode==='compare'){const item=nextObject(),left=rand(1,6),right=rand(1,6);answer=Math.sign(left-right);task.innerHTML='<div class="prompt">Kde je více obrázků?</div><div class="compare"><section><h2>Vlevo</h2><div class="display">'+group(left,item)+'</div></section><section><h2>Vpravo</h2><div class="display">'+group(right,item)+'</div></section></div>';choices(['⬅️ Vlevo','Stejně','Vpravo ➡️'],v=>say((v==='⬅️ Vlevo'?1:v==='Vpravo ➡️'?-1:0)===answer))}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));newTask()}));newTask();
</script></body></html>
