(()=>{'use strict';let max=5,dir='up',correct=0,solved=false,previous='',lastMix='down';const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);function select(){document.querySelectorAll('[data-max]').forEach(b=>{b.classList.toggle('selected',+b.dataset.max===max);b.setAttribute('aria-pressed',String(+b.dataset.max===max))});document.querySelectorAll('[data-dir]').forEach(b=>{b.classList.toggle('selected',b.dataset.dir===dir);b.setAttribute('aria-pressed',String(b.dataset.dir===dir))})}function newGame(){solved=false;$('feedback').textContent='';let direction=dir==='mix'?(lastMix=lastMix==='up'?'down':'up'):dir;let len=max===5?4:5,start=rand(max-len+2),values=Array.from({length:len},(_,i)=>start+i);if(direction==='down')values.reverse();let missing=rand(len-2)+1,signature=direction+'-'+start+'-'+missing;if(signature===previous)missing=(missing%(len-2))+1;correct=values[missing];previous=signature;$('instruction').textContent=direction==='up'?'⬆️ Doplň číslo ve vzestupné řadě':'⬇️ Doplň číslo v sestupné řadě';$('sequence').replaceChildren();values.forEach((v,i)=>{let el=document.createElement('div');el.className='tile'+(i===missing?' blank':'');el.textContent=i===missing?'':String(v);if(i===missing){el.id='missing';el.setAttribute('aria-label','Chybějící číslo')} $('sequence').append(el)});let options=new Set([correct]),candidates=[];for(let v=Math.max(0,correct-5);v<=Math.min(max,correct+5);v++)if(v!==correct)candidates.push(v);while(options.size<Math.min(4,max+1)){let pool=candidates.filter(v=>!options.has(v));options.add(pool.length?pool[rand(pool.length)]:rand(max+1))}let arr=[...options].sort((a,b)=>a-b);$('answers').replaceChildren();arr.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('aria-label','Číslo '+n);b.addEventListener('click',()=>answer(n));$('answers').append(b)})}function answer(n){if(solved)return;const tile=$('missing');if(n===correct){solved=true;tile.textContent=n;tile.classList.remove('blank','wrong');tile.classList.add('filled');$('feedback').textContent='🌟 Výborně! Správně!';$('answers').querySelectorAll('button').forEach(b=>b.disabled=true)}else{tile.classList.add('wrong');$('feedback').textContent='💛 Zkus to ještě jednou!'}}$('ranges').addEventListener('click',e=>{let b=e.target.closest('[data-max]');if(b){max=+b.dataset.max;select();newGame()}});$('directions').addEventListener('click',e=>{let b=e.target.closest('[data-dir]');if(b){dir=b.dataset.dir;select();newGame()}});$('next').addEventListener('click',newGame);select();newGame()})();
</script></body></html>
