(()=>{'use strict';let range=5,operation='add',current=null,locked=false,lastKey='',mixNext='add';const motifs=['🍎','🍐','🍓','⭐','🌼','🐞','🍄','🦋','🌻','🥕'];const pick=a=>a[Math.floor(Math.random()*a.length)];const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;const $=id=>document.getElementById(id);function generate(){let a,b,op=operation==='mix'?(mixNext=mixNext==='add'?'sub':'add'):operation;let attempts=0;do{if(op==='add'){if(range===20){a=rand(1,19);const maxB=(a<10)?(10-a):(20-a);b=rand(1,Math.max(1,maxB));}else{a=rand(1,range-1);b=rand(1,range-a)}}else{if(range===20){a=rand(2,20);b=rand(1,a<=10?a:Math.min(9,a%10||10));if(a>10&&a%10===0)b=rand(1,Math.min(9,a));}else{a=rand(1,range);b=rand(1,a)}}attempts++}while(`${a},${b},${op}`===lastKey&&attempts<30);lastKey=`${a},${b},${op}`;return {a,b,op,result:op==='add'?a+b:a-b,motif:pick(motifs)}}function render(){current=generate();locked=false;$('a').textContent=current.a;$('b').textContent=current.b;$('symbol').textContent=current.op==='add'?'+':'−';$('result').textContent='?';$('result').classList.add('empty');$('feedback').textContent='Vyber správný výsledek. ⭐';$('feedback').style.color='#3d210e';const v=$('visual');v.replaceChildren();v.className='visual '+(current.op==='add'?'plus':'minus');function items(count,crossFrom=Infinity){const d=document.createElement('div');d.className='items';for(let i=0;i<count;i++){let x=document.createElement('span');x.className='item'+(i>=crossFrom?' cross':'');x.textContent=current.motif;d.append(x)}return d}if(current.op==='sub'){v.append(items(current.a,current.a-current.b))}else{v.append(items(current.a));let plus=document.createElement('span');plus.className='split';plus.textContent='+';v.append(plus,items(current.b))}const ans=$('answers');ans.replaceChildren();for(let n=0;n<=range;n++){const btn=document.createElement('button');btn.className='num';btn.textContent=n;btn.type='button';btn.addEventListener('click',()=>choose(n));ans.append(btn)}}function choose(n){if
