function show(which){for(const id of ['start','play','finish'])document.getElementById(id).classList.toggle('hidden',id!==which)}
function showStart(){show('start')}
function start(m){mode=m;order=shuffle(words.map((_,i)=>i));idx=0;firstTries=0;show('play');render()}
function render(){solved=false;const item=order[idx],w=words[item];document.getElementById('count').textContent=`${idx+1} / ${words.length}`;document.getElementById('bar').style.width=(idx/words.length*100)+'%';document.getElementById('instruction').textContent=mode===1?'PODÍVEJ SE NA OBRÁZEK A NAJDI STEJNÉ SLOVO':'PODÍVEJ SE NA OBRÁZEK A VYBER SPRÁVNÉ SLOVO';document.getElementById('picture').src=pics[item];const t=document.getElementById('target');t.textContent=w;t.classList.toggle('hidden',mode===2);document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;const options=shuffle([item,...shuffle(words.map((_,i)=>i).filter(i=>i!==item)).slice(0,2)]);const holder=document.getElementById('answers');holder.innerHTML='';for(const opt of options){const b=document.createElement('button');b.className='answer';b.textContent=words[opt];b.onclick=()=>{if(solved)return;if(opt===item){solved=true;firstTries++;b.classList.add('correct');document.getElementById('feedback').textContent='🌟 SPRÁVNĚ! VÝBORNĚ! 🌟';document.getElementById('next').disabled=false;[...holder.children].forEach(x=>x.disabled=true)}else{b.classList.add('wrong');b.disabled=true;document.getElementById('feedback').textContent='🍀 ZKUS TO JEŠTĚ JEDNOU!'}};holder.appendChild(b)}}
