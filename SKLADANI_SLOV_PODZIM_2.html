let mode=1,order=[],idx=0,selected=[],tiles=[],solved=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){for(const n of ['start','play','finish'])document.getElementById(n).classList.toggle('hidden',n!==id)}
function start(m){mode=m;order=shuffle(words.map((_,i)=>i));idx=0;show('play');render()}
function render(){solved=false;selected=[];const i=order[idx],w=words[i];tiles=shuffle([...w].map((letter,id)=>({letter,id})));document.getElementById('count').textContent=(idx+1)+' / '+words.length;document.getElementById('bar').style.width=(idx/words.length*100)+'%';document.getElementById('picture').src=pics[i];document.getElementById('example').textContent=mode===1?w:'';document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;draw()}
function draw(){const slots=document.getElementById('slots'),letters=document.getElementById('letters');slots.innerHTML='';letters.innerHTML='';const w=words[order[idx]];for(let i=0;i<w.length;i++){const b=document.createElement('button');b.className='slot'+(selected[i]!==undefined?' filled':'');b.textContent=selected[i]===undefined?'':tiles.find(t=>t.id===selected[i]).letter;b.setAttribute('aria-label','Pozice '+(i+1));b.disabled=selected[i]===undefined||solved;b.onclick=()=>removeAt(i);slots.appendChild(b)}for(const t of tiles){const b=document.createElement('button');b.className='letter';b.textContent=t.letter;b.disabled=selected.includes(t.id)||solved;b.onclick=()=>add(t.id);letters.appendChild(b)}}
function add(id){if(solved||selected.length>=words[order[idx]].length)return;selected.push(id);check();draw()}
function removeAt(i){if(solved)return;selected.splice(i,1);document.getElementById('feedback').textContent='';draw()}
function clearWord(){if(solved)return;selected=[];document.getElementById('feedback').textContent='';draw()}
function check(){const w=words[order[idx]];if(selected.length!==w.length)return;const built=selected.map(id=>tiles.find(t=>t.id===id).letter).join('');if(built===w){solved=true;document.getElementById('feedback').textContent='🌟 SPRÁVNĚ! SKVĚLÁ PRÁCE! 🌟';document.getElementById('next').disabled=false}else{document.getElementById('feedback').textContent='🍀 ZKUS PÍSMENA PŘESKLÁDAT!'}}
function advance(){if(!solved)return;idx++;if(idx===words.length){show('finish');document.getElementById('bar').style.width='100%'}else render()}
</script></body></html>
