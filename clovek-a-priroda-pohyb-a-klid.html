()=>`<div class="split">${image('bus','Cestující sedí v jedoucím autobusu a za oknem se pohybuje okolí')}<div><p class="lead">Honzík sedí v autobuse. Autobus jede kolem domů a stromů.</p><p>Je Honzík v klidu, nebo v pohybu? Záleží na tom, k čemu ho porovnáme.</p><div class="callout">O POHYBU A KLIDU ROZHODUJEME VŽDY VZHLEDEM K JINÉMU TĚLESU.</div></div></div>`,
()=>`<div class="split">${image('bus','Cestující sedí na sedačce v autobuse, za oknem jsou stromy')}<div><p class="lead">Jeden cestující – dvě různé odpovědi.</p><div class="ref-grid"><button class="ref" data-ref="seat">🪑 POROVNÁM HO SE SEDAČKOU</button><button class="ref" data-ref="road">🌳 POROVNÁM HO SE STROMEM U SILNICE</button></div><div class="note" id="refResult">VYBER, K ČEMU CESTUJÍCÍHO POROVNÁŠ.</div><p>Vůči sedačce je cestující v klidu. Vůči stromu u silnice je v pohybu, protože se jeho poloha mění.</p></div></div>`,
()=>`<div class="split">${image('walk','Žák jde chodbou kolem dveří a skříněk')}<div><p class="lead">Všímáme si okolí a vybereme si pevný bod.</p><div class="examples"><div class="example"><strong>V KLIDU VŮČI STOLU</strong>Sešit položený na stole nemění svou polohu vzhledem ke stolu.</div><div class="example"><strong>V POHYBU VŮČI STĚNĚ</strong>Žák kráčející chodbou mění svou polohu vzhledem ke stěně.</div><div class="example"><strong>V KLIDU VŮČI SEDAČCE</strong>Cestující sedí na místě, když autobus stojí.</div><div class="example"><strong>V POHYBU VŮČI SILNICI</strong>Jedoucí autobus mění svou polohu vzhledem k silnici.</div></div><div class="note">OTÁZKA ZNÍ: VŮČI ČEMU POLOHU SLEDUJEME?</div></div></div>`,
()=>`<div class="split">${image('cars','Dvě autíčka se chystají jet po stejně dlouhých dráhách')}<div><p class="lead">Které autíčko se pohybuje rychleji?</p><p>Porovnáváme-li stejně dlouhou dráhu, rychlejší je to, které ji ujede za kratší dobu.</p><p>Když urazí za stejnou dobu delší dráhu, také se pohybuje rychleji.</p><div class="callout">STEJNÁ DRÁHA + KRATŠÍ ČAS = RYCHLEJŠÍ POHYB</div><p>Například chůze je pomalejší než jízda na kole. Rychlost porovnáváme podle toho, jak se mění poloha tělesa v čase.</p></div></div>`,
()=>`<h2>POZORUJEME A POROVNÁVÁME</h2>${image('cars','Dvě autíčka na rovných drahách s metrem a stopkami','wide-photo')}<p class="lead">Připrav dvě autíčka, stejnou startovní čáru, dvě stejně dlouhé dráhy a stopky.</p><div class="steps"><div class="step">Polož autíčka na stejný start.</div><div class="step">Postupně je pusť a změř čas na stejné dráze.</div><div class="step">Porovnej časy. Kratší čas znamená rychlejší jízdu.</div></div><div class="note">POKUS MŮŽEŠ ZOPAKOVAT. ZKUS AUTÍČKO JEMNĚ POPOSUNOUT A POTOM HO ROZJET VĚTŠÍ SILOU.</div>`,

function quizPage(){if(quizIndex>=questions.length)return `<div class="callout"><h2>HOTOVO!</h2><p>Správně máš ${correct.size} ze 3 odpovědí.</p><p>Zapamatuj si: pohyb i klid vždy posuzujeme vzhledem k jinému tělesu.</p></div>`;const q=questions[quizIndex];return `<div class="quiz"><div class="question">${quizIndex+1}. ${q.q}</div><div class="answers">${q.opts.map(([key,label,ok])=>`<button class="answer" data-ok="${ok}">${image(key,label,'')}<span>${label}</span></button>`).join('')}</div><div class="feedback" id="feedback">VYBER ODPOVĚĎ.</div><button class="nextq" id="nextq" hidden>${quizIndex===questions.length-1?'VÝSLEDEK':'DALŠÍ OTÁZKA →'}</button></div>`}
function render(){document.getElementById('title').textContent=titles[page];document.getElementById('content').innerHTML=pages[page]();document.getElementById('fill').style.width=`${(page+1)/titles.length*100}%`;document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===titles.length-1?'ZPĚT NA ZAČÁTEK':'DALŠÍ →';document.getElementById('prev').onclick=()=>{if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{page<titles.length-1?page++:page=0;render();window.scrollTo(0,0)};document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ref]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('refResult').textContent=b.dataset.ref==='seat'?'VŮČI SEDAČCE JE CESTUJÍCÍ V KLIDU.':'VŮČI STROMU JE CESTUJÍCÍ V POHYBU.'});if(page===5)wireQuiz()}
function wireQuiz(){document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1';b.classList.add(ok?'correct':'wrong');b.disabled=true;document.getElementById('feedback').textContent=ok?'SPRÁVNĚ!':'ZKUS TO ZNOVU.';if(ok){correct.add(quizIndex);document.querySelectorAll('[data-ok="0"]').forEach(x=>x.disabled=true);const n=document.getElementById('nextq');n.hidden=false;n.onclick=()=>{quizIndex++;render()}}})}
render();
</script></body></html>
