;const p=document.getElementById('detail');p.hidden=false;document.getElementById('subjectTitle').textContent=names[i];document.getElementById('topics').innerHTML='';topics[i].forEach(t=>{const x=document.createElement('div');x.className='topic';x.textContent=t;if(i===0&&t==='GLOBÁLNÍ ČTENÍ'){x.style.cursor='pointer';x.setAttribute('role','button');x.setAttribute('tabindex','0');const show=()=>{document.getElementById('subjectTitle').textContent='GLOBÁLNÍ ČTENÍ';const c=document.getElementById('topics');c.innerHTML='';const link=document.createElement('a');link.className='topic';link.href='GLOBALNI_CTENI_PODZIM_NOVE_OBRAZKY.html';link.textContent='🍁 PODZIM – GLOBÁLNÍ ČTENÍ';link.style.display='block';link.style.textDecoration='none';link.style.color='inherit';c.appendChild(link);const back=document.createElement('button');back.className='homebtn';back.textContent='← ZPĚT NA ČTENÍ';back.onclick=()=>openSubject(0);c.appendChild(back)};x.addEventListener('click',show);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}})}if(i===0&&t==='PÍSMENA'){x.style.cursor='pointer';x.setAttribute('role','link');x.setAttribute('tabindex','0');x.title='Otevřít hru Písmena';x.addEventListener('click',()=>{window.location.href='hra-pismena.html'});x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();window.location.href='hra-pismena.html'}})}if(i===3&&t==='🔢 Doplňujeme číselné řady'){x.style.cursor='pointer';x.setAttribute('role','link');x.setAttribute('tabindex','0');const play=()=>{window.location.href='CISELNE_RADY_LESNI_HRA.html'};x.addEventListener('click',play);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play()}})}if(i===3&&t==='🌼 Počítáme s obrázky'){x.style.cursor='pointer';x.setAttribute('role','link');x.setAttribute('tabindex','0');const play=()=>{window.location.href='POCITAME_S_OBRAZKY_HRA.html'};x.addEventListener('click',play);x.addEventListener('keydown',e=> ument.getElementById('detail').hidden=true;document.getElementById('home').hidden=false;window.scrollTo(0,0)}</script></body></html>
