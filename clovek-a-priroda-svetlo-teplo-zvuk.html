<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d43"><title>Světlo, teplo a zvuk | Člověk a příroda</title>
<style>
:root{--ink:#183b36;--green:#174d43;--leaf:#2d7864;--mint:#eaf5ef;--gold:#e9ad37;--cream:#fffaf0;--line:#d8e8df;--shadow:0 12px 36px #163b3017}
*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:linear-gradient(135deg,#f4f8f4,#f5f3eb);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}button{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.65rem clamp(.8rem,3vw,2rem);background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:.9rem;font-weight:800;letter-spacing:.04em;color:var(--green)}.controls{display:flex;gap:.5rem;align-items:center}
.iconbtn,.navbtn{border:0;border-radius:15px;background:var(--green);color:white;font-weight:800;cursor:pointer;min-height:52px;padding:.65rem 1rem}.iconbtn{background:#edf4ef;color:var(--green);min-width:52px}.iconbtn:hover,.navbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}.home-link{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.stage-wrap{flex:1;display:flex;justify-content:center;align-items:center;padding:clamp(.65rem,2vw,1.4rem)}.stage{width:min(1500px,100%);min-height:min(790px,calc(100vh - 156px));background:#fff;border:1px solid #e1ebe4;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.slidehead{padding:clamp(1rem,2.5vw,2rem) clamp(1rem,4vw,3rem) .5rem}.tag{display:inline-block;background:#e7f2eb;color:var(--leaf);font-weight:800;font-size:.83rem;letter-spacing:.06em;padding:.45rem .8rem;border-radius:999px}
h1,h2{margin:.7rem 0 .55rem;color:var(--green);line-height:1.08}h1{font-size:clamp(2rem,5vw,4.2rem);letter-spacing:.015em;text-transform:uppercase}h2{font-size:clamp(1.7rem,3.7vw,3rem);text-transform:uppercase}.lead{font-size:clamp(1.15rem,2vw,1.55rem);line-height:1.4;margin:.25rem 0 0;max-width:1000px}
.content{padding:.7rem clamp(1rem,4vw,3rem) 1.5rem;flex:1;display:flex;flex-direction:column;justify-content:center}.hero,.cover{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(1rem,3vw,2.4rem);align-items:center}.hero img,.cover img{width:100%;height:clamp(270px,43vh,510px);object-fit:cover;border-radius:22px;background:#edf3ef}.cover img{height:clamp(320px,52vh,600px)}
.textbox{font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.45;background:var(--cream);border-left:8px solid var(--gold);padding:1.1rem 1.25rem;border-radius:6px 18px 18px 6px;margin-top:1rem}
.grid{display:grid;gap:1rem}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 5px 18px #183b3609;display:flex;flex-direction:column}.card img{width:100%;height:clamp(155px,24vh,270px);object-fit:cover;background:#f2f5f0}.cardbody{padding:1rem 1.05rem;flex:1}.card h3{font-size:clamp(1.1rem,1.7vw,1.55rem);margin:0 0 .45rem;color:var(--green);text-transform:uppercase}.card p{font-size:clamp(1rem,1.45vw,1.25rem);line-height:1.38;margin:.2rem 0}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.compare .card img{height:clamp(300px,47vh,520px)}
.quiz{background:#f4f8f5;border:2px solid var(--line);padding:clamp(1rem,2.5vw,2rem);border-radius:22px}.question{font-size:clamp(1.35rem,2.5vw,2rem);font-weight:800;line-height:1.25;margin:0 0 1.2rem}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.answer{border:3px solid #ccded2;background:white;color:var(--ink);border-radius:16px;padding:1rem;min-height:76px;font-weight:800;font-size:clamp(1.1rem,1.8vw,1.45rem);cursor:pointer;text-align:left}.answer:hover{border-color:var(--leaf);background:#f4faf6}.answer.correct{background:#dff2e4;border-color:#359462}.answer.wrong{background:#fff0e9;border-color:#cf765a}.feedback{min-height:2rem;font-weight:800;font-size:1.15rem;padding-top:.8rem}
.safety{background:#fff4e5;border:2px solid #f0d5a0;border-radius:18px;padding:1.1rem 1.3rem;font-size:clamp(1.1rem,1.7vw,1.4rem);line-height:1.42;margin-top:1rem}
.footer{display:flex;align-items:center;gap:.8rem;padding:.8rem clamp(1rem,3vw,2rem);border-top:1px solid var(--line);background:#fbfdfb}.progress{flex:1;height:12px;background:#e5eee8;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--leaf),#86b45f);width:0;transition:width .2s}.count{font-weight:800;min-width:76px;text-align:center}.navbtn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.start{display:inline-flex;margin-top:1.2rem;border:0;border-radius:16px;padding:1rem 1.5rem;background:var(--gold);color:#263c33;font-weight:900;font-size:1.2rem;cursor:pointer}.return-home{display:flex;width:fit-content;max-width:100%;justify-content:center;text-align:center;text-decoration:none;line-height:1.2}.toc{position:fixed;inset:0;background:#142b26a6;display:none;align-items:center;justify-content:center;padding:1rem;z-index:5}.toc.open{display:flex}.tocbox{background:white;max-width:850px;width:100%;max-height:85vh;overflow:auto;border-radius:22px;padding:1.2rem}.tocbox h2{margin-top:.2rem}.tocitems{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.tocitems button{background:#f0f6f1;border:1px solid var(--line);border-radius:12px;padding:.7rem;text-align:left;font-weight:700;color:var(--ink);cursor:pointer}.close{float:right}
@media(max-width:850px){.stage{min-height:calc(100vh - 140px)}.hero,.cover{grid-template-columns:1fr}.hero img{height:34vh}.cover img{height:32vh}.grid.four,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three .card:last-child:nth-child(odd){grid-column:span 2}.compare .card img{height:30vh}}
@media(max-width:560px){.home-label{display:none}html{font-size:16px}.top{padding:.55rem}.brand{font-size:.72rem}.controls{gap:.25rem}.iconbtn{min-width:44px;min-height:44px;padding:.45rem}.stage{border-radius:16px;min-height:calc(100vh - 120px)}.grid.two,.grid.three,.grid.four,.compare{grid-template-columns:1fr}.grid.three .card:last-child:nth-child(odd){grid-column:auto}.card img{height:230px}.answers{grid-template-columns:1fr}.footer{gap:.4rem;padding:.6rem}.navbtn{padding:.55rem .7rem;min-height:46px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

const stage=document.getElementById('stage'),bar=document.getElementById('bar'),count=document.getElementById('count');let index=0,fontScale=1;
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function img(n,alt){return '<img src="'+IMG[n]+'" alt="'+esc(alt||'')+'">'}
function card(c){return '<article class="card">'+img(c.image,c.title)+'<div class="cardbody"><h3>'+esc(c.title)+'</h3><p>'+esc(c.text)+'</p></div></article>'}
function render(){const s=slides[index];let inner='';
 if(s.layout==='cover'){inner='<div class="content"><div class="cover">'+img(s.image,s.caption)+'<div><span class="tag">'+esc(s.section)+'</span><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p><div class="textbox">'+esc(s.body)+'</div><button class="start" onclick="go(1)">ZAČÍT PREZENTACI →</button></div></div></div>'}
 else {let body='';
 if(s.layout==='hero'){body='<div class="hero">'+img(s.image,s.alt)+'<div><p class="lead">'+esc(s.body)+'</p>'+(s.note?'<div class="safety">'+esc(s.note)+'</div>':'')+'</div></div>'}
 if(s.layout==='cards'){body='<div class="grid '+(s.cards.length===4?'four':s.cards.length===3?'three':'two')+'">'+s.cards.map(card).join('')+'</div>'+(s.note?'<div class="safety">'+esc(s.note)+'</div>':'')}
 if(s.layout==='compare'){body='<div class="compare">'+s.cards.map(card).join('')+'</div>'}
 if(s.layout==='quiz'){body='<div class="quiz"><p class="question">'+esc(s.question)+'</p><div class="answers">'+s.options.map((o,i)=>'<button class="answer" data-i="'+i+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" aria-live="polite"></div></div>'}
 if(s.layout==='closing'){body='<div class="hero">'+img(s.image,'Noční obloha')+'<div><p class="lead">'+esc(s.body).replace(/\\n/g,'<br>')+'</p><div class="safety">'+esc(s.note)+'</div><a class="start return-home" href="index.html">⌂ ZPĚT DO HLAVNÍHO MENU</a></div></div>'}
 inner='<div class="slidehead"><span class="tag">'+esc(s.section)+'</span><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.lead)+'</p></div><div class="content">'+body+'</div>'}
 stage.innerHTML=inner;document.getElementById('prevBtn').disabled=index===0;document.getElementById('nextBtn').disabled=index===slides.length-1;document.getElementById('nextBtn').textContent=index===slides.length-1?'KONEC':'DALŠÍ →';count.textContent=(index+1)+' / '+slides.length;bar.style.width=((index+1)/slides.length*100)+'%';
 const q=stage.querySelector('.quiz');if(q)q.querySelectorAll('.answer').forEach(function(b){b.onclick=function(){const ok=Number(b.dataset.i)===s.correct;q.querySelectorAll('.answer').forEach(function(x){x.disabled=true;if(Number(x.dataset.i)===s.correct)x.classList.add('correct')});if(!ok)b.classList.add('wrong');q.querySelector('.feedback').textContent=(ok?'✓ ':'ZKUS TO ZNOVU PŘI DALŠÍM OPAKOVÁNÍ. ')+s.after}})
}
function go(i){index=Math.max(0,Math.min(slides.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('prevBtn').onclick=function(){go(index-1)};document.getElementById('nextBtn').onclick=function(){go(index+1)};
document.getElementById('fontBtn').onclick=function(){fontScale=fontScale>=1.3?1:fontScale+.1;document.documentElement.style.fontSize=(18*fontScale)+'px'};
document.getElementById('fullBtn').onclick=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen()};
const toc=document.getElementById('toc'),items=document.getElementById('tocitems');items.innerHTML=slides.map(function(s,i){return '<button data-slide="'+i+'">'+String(i+1).padStart(2,'0')+' · '+esc(s.title)+'</button>'}).join('');
document.getElementById('tocBtn').onclick=function(){toc.classList.add('open')};document.getElementById('closeToc').onclick=function(){toc.classList.remove('open')};items.onclick=function(e){const b=e.target.closest('[data-slide]');if(b){go(Number(b.dataset.slide));toc.classList.remove('open')}};toc.onclick=function(e){if(e.target===toc)toc.classList.remove('open')};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key==='Escape')toc.classList.remove('open')});render();
