us:5px 14px 14px 5px;background:var(--cream);font-weight:700;line-height:1.5}.note{padding:.8rem 1rem;margin-top:1rem;border-radius:13px;background:var(--blue);line-height:1.45}.grid{display:grid;gap:.85rem}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.state-card,.test-card,.answer{border:2px solid var(--line);border-radius:16px;background:#fff;padding:1rem;text-align:center}.state-card img{width:100%;height:clamp(130px,21vh,220px);object-fit:contain;border-radius:10px;background:#f7faf8}.state-card h3{font-size:1.25rem}.state-card p{font-size:1rem}.fact-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin:1rem 0}.fact{padding:1.1rem;border-radius:16px;background:var(--mint);text-align:center}.fact strong{display:block;color:var(--green);font-size:clamp(1.8rem,4vw,3rem);margin-bottom:.3rem}.processes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.process{padding:1rem;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}.process strong{display:block;font-size:1.15rem;color:var(--green);margin-bottom:.35rem}.process span{display:block;line-height:1.4}.process.selected{border-color:#52a68d;background:#eef8f2}.steps{counter-reset:step;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:1rem 0}.step{padding:1rem;border-radius:15px;background:#f2f7f3;border:1px solid var(--line);line-height:1.45}.step:before{counter-increment:step;content:counter(step);display:inline-grid;place-items:center;width:2rem;height:2rem;margin-right:.4rem;border-radius:50%;background:var(--green);color:white;font-weight:900}.safety{padding:1rem;border:2px solid #e8c2ba;border-radius:14px;background:#fff5f3;font-weight:700;line-height:1.45}.test-card{cursor:pointer;min-height:145px;color:var(--ink);font-weight:700}.test-card span{display:block;font-size:2.2rem;margin-bottom:.4rem}.test-card small{display:block;margin-top:.5rem;font-size:.95rem;line-height:1.35;font-weight:500}.test-card.selected{border-color:#52a68d;background:#eef8f2}.quiz{max-width:1000px;margin:0 auto;width:100%}.question{font-size:clamp(1.2rem,2vw,1.55rem);font-weight:800;text-align:center;margin:.5rem 0 1rem}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}.answer{cursor:pointer;min-height:120px;color:var(--ink);font-weight:800;line-height:1.4}.answer img{display:block;width:100%;height:clamp(110px,16vh,170px);object-fit:contain;margin-bottom:.4rem;background:#f7faf8;border-radius:10px}.answer.correct{background:#e9f6ee;border-color:#52a66b}.answer.wrong{background:#fff0ed;border-color:#d98976}.feedback{text-align:center;min-height:2.5rem;padding:.8rem;font-weight:800}.next-question{display:block;margin:.2rem auto;padding:.8rem 1rem;border:0;border-radius:12px;background:var(--green);color:white;font-weight:800;cursor:pointer}.controls{display:flex;gap:.6rem;padding:.8rem clamp(1rem,4vw,2.8rem) 1.2rem}.navbtn{border:0;border-radius:12px;background:#edf4ef;color:var(--green);font-weight:800;cursor:pointer;min-height:48px;padding:.65rem 1rem}.navbtn.next{margin-left:auto;background:var(--green);color:white}.navbtn:disabled{opacity:.45;cursor:default}.small{font-size:.95rem;color:#536c64}@media(max-width:720px){.cover,.split,.three,.two,.fact-row,.processes,.steps,.answers{grid-template-columns:1fr}.stage{min-height:0}.photo{height:240px}.answers .answer{min-height:0}.answers .answer img{height:135px}}

const img=(key,alt,cls='photo')=>`<img class="${cls}" src="${photos[key]}" alt="${alt}">`;
let page=0,quizIndex=0,correct=new Set();
const titles=['PŘEMĚNY SKUPENSTVÍ A VLASTNOSTI LÁTEK','PEVNÉ, KAPALNÉ A PLYNNÉ LÁTKY','TÁNÍ A TUHNUTÍ','TEPLOTA TÁNÍ A VARU','POKUS: CO SE DĚJE S LEDEM?','POKUS: JAK SE CHOVÁ VZDUCH A MATERIÁLY?','OBRÁZKOVÉ OPAKOVÁNÍ'];
const content=[
()=>`<div class="cover">${img('states','Kámen, voda a vzduch na laboratorním stole')}<div><p class="lead">Proč led taje? Dá se vzduch stlačit? A co udělá houbička, když ji zmáčkneme?</p><p>V této kapitole budeme pozorovat tři skupenství látek a zkoumat několik vlastností běžných materiálů.</p><div class="callout">PŘI POKUSECH SE ZAPOJÍME, POZORUJEME A POPÍŠEME, CO SE STALO.</div></div></div>`,
()=>`<div class="split">${img('states','Pevný kámen, kapalná voda a vzduch v balónku')}<div class="grid"><article class="state-card"><h3>PEVNÉ</h3><p>Kámen i led mají svůj tvar.</p></article><article class="state-card"><h3>KAPALNÉ</h3><p>Voda teče a přizpůsobí se nádobě.</p></article><article class="state-card"><h3>PLYNNÉ</h3><p>Vzduch nevidíme. Zabírá místo a vyplní prostor.</p></article></div></div><div class="note"><strong>PŘÍKLAD:</strong> Voda může být led, tekoucí voda nebo vodní pára.</div>`,
()=>`<div class="split"><div>${img('freeze','Led taje ve vodě a voda je také ve formě ledu','photo-small')}<div class="processes"><button class="process" data-process="melting"><strong>TÁNÍ</strong><span>Pevná látka se zahřívá a mění se na kapalinu. Led taje na vodu.</span></button><button class="process" data-process="freezing"><strong>TUHNUTÍ</strong><span>Kapalina se ochlazuje a mění se na pevnou látku. Voda zmrzne na led.</span></button></div></div><div><p class="lead">Skupenství se může změnit, když látku zahříváme nebo ochlazujeme.</p><div class="callout">LED → VODA: TÁNÍ<br>VODA → LED: TUHNUTÍ</div><p class="small" id="processNote">KLEPNI NA KARTIČKU A PŘEČTI SI, CO SE MĚNÍ.</p></div></div>`,
()=>`<p class="lead">U čisté vody za běžného tlaku:</p><div class="fact-row"><div class="fact"><strong>0 °C</strong>LED TÁNÍ A VODA TUHNUTÍ</div><div class="fact"><strong>100 °C</strong>VODA VŘE A MĚNÍ SE V PÁRU</div></div><div class="split">${img('boil','Učitel předvádí ohřev vody v rychlovarné konvici','photo-small')}<div><p>Při tání se led mění na kapalnou vodu. Při varu se voda mění na vodní páru.</p><div class="note"><strong>POKUS PŘEDVÁDÍ UČITEL.</strong> Horké konvice ani páry se nedotýkáme.</div><div class="note"><strong>POZOR:</strong> Vodní pára je neviditelný plyn. Bílý obláček nad konvicí tvoří drobné kapičky vody.</div><p class="small">Teploty se mohou měnit podle podmínek. Zde uvádíme běžné hodnoty pro vodu.</p></div></div>`,
()=>`<div class="split">${img('ice','Ledová kostka taje v misce vedle teploměru')}<div><p class="lead">Pokus A: pozorujeme tání</p><div class="steps"><div class="step">Vložte kostku ledu do misky.</div><div class="step">Každou minutu zkontrolujte, co se mění.</div><div class="step">Popište: co bylo na začátku a co na konci?</div></div><p><strong>Výsledek:</strong> Led se změnil na vodu. Proběhlo tání.</p></div></div><div class="split">${img('freeze','Voda a led v nádobce na led')}<div><p class="lead">Pokus B: pozorujeme tuhnutí</p><p>Do tvořítka nalijeme vodu. Dospělý ho uloží do mrazničky. Později porovnáme kapalnou vodu a led.</p><p><strong>Výsledek:</strong> Voda se ochlazovala a ztuhla.</p></div></div>`,
()=>`<div class="split">${img('air','Ruka stlačuje vzduch v uzavřené plastové stříkačce bez jehly')}<div><p class="lead">Vzduch ve stříkačce</p><p>Stříkačka je bez jehly a její otvor uzavře dospělý. Zkusíme jemně zatlačit na píst a potom ho pustíme.</p><p><strong>Co pozorujeme?</strong> Vzduch má stlačitelnost. Po uvolnění se rozpíná a tlačí píst zpět.</p><div class="note">NEPOUŽÍVÁME JEHLU. POKUS PROVÁDÍME PODLE POKYNŮ UČITELE.</div></div></div><div class="grid two" style="margin-top:1rem"><button class="test-card" data-test="sponge"><span>🧽</span>HOUBIČKA<small>Stlačitelnost: Jemně ji stlač a uvolni. Vrátí se do původního tvaru?</small></button><button class="test-card" data-test="clay"><span>🟣</span>PLASTELÍNA<small>ZMĚNA TVARU: Vytvaruj ji. Zůstane chvíli v novém tvaru?</small></button><button class="test-card" data-test="wire"><span>〰️</span>OHEBNÝ DRÁT<small>OHEBNOST: Opatrně ho ohni. Jak se změnil jeho tvar?</small></button><button class="test-card" data-test="air"><span>💨</span>VZDUCH<small>STLAČITELNOST A ROZPÍNAVOST: Stlač vzduch ve stříkačce bez jehly.</small></button></div><div class="note" id="testNote">KLEPNI NA MATERIÁL A PŘEČTI SI, CO SLEDUJEME.</div>`,
()=>quizPage()
];
const questions=[
{q:'KTERÉ Z TĚCHTO LÁTEK JE PEVNÉ SKUPENSTVÍ?',opts:[['states','KÁMEN',1],['boil','VODA VE SKLENICI',0],['air','VZDUCH',0]]},
{q:'CO SE DĚJE PŘI TÁNÍ LEDU?',opts:[['ice','LED SE MĚNÍ NA VODU',1],['freeze','VODA SE MĚNÍ NA LED',0],['states','KÁMEN SE MĚNÍ NA VZDUCH',0]]},
{q:'KOLIK STUPŇŮ MÁ TEPLOTA TÁNÍ LEDU?',opts:[['ice','0 °C',1],['boil','100 °C',0],['air','20 °C',0]]},
{q:'KTEROU LÁTKU MŮŽEME VE STŘÍKAČCE STLAČIT?',opts:[['air','VZDUCH',1],['ice','LED',0],['states','KÁMEN',0]]}
];
function quizPage(){if(quizIndex>=questions.length)return `<div class="callout"><h2>VÝBORNĚ!</h2><p>Dokončil/a jsi opakování. Správně máš ${correct.size} ze 4 odpovědí.</p></div><p>Zapamatuj si: pevné, kapalné a plynné skupenství. Led taje a voda tuhne. Vzduch lze stlačit.</p>`;let q=questions[quizIndex];return `<div class="quiz"><div class="question">${quizIndex+1}. ${q.q}</div><div class="answers">${q.opts.map(([key,label,ok])=>`<button class="answer" data-ok="${ok}">${img(key,label,'')}<span>${label}</span></button>`).join('')}</div><div class="feedback" id="feedback">VYBER SPRÁVNOU ODPOVĚĎ.</div><button class="next-question" id="nextQuestion" hidden>${quizIndex===questions.length-1?'ZOBRAZIT VÝSLEDEK':'DALŠÍ OTÁZKA →'}</button></div>`}
function render(){document.getElementById('title').textContent=titles[page];document.getElementById('content').innerHTML=content[page]();document.getElementById('progressFill').style.width=`${(page+1)/titles.length*100}%`;document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===titles.length-1?'ZPĚT NA ZAČÁTEK':'DALŠÍ →';document.getElementById('prev').onclick=()=>{if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{if(page<titles.length-1){page++;render();window.scrollTo(0,0)}else{page=0;render();window.scrollTo(0,0)}};document.querySelectorAll('[data-process]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-process]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('processNote').textContent=b.dataset.process==='melting'?'TÁNÍ: PEVNÁ LÁTKA SE MĚNÍ NA KAPALINU.':'TUHNUTÍ: KAPALINA SE MĚNÍ NA PEVNOU LÁTKU.'});document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-test]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const notes={sponge:'HOUBIČKU LZE STLAČIT. PO UVOLNĚNÍ SE VĚTŠINOU VRÁTÍ.',clay:'PLASTELÍNA SNADNO ZMĚNÍ TVAR A NOVÝ TVAR SI CHVÍLI PONECHÁ.',wire:'OHEBNÝ DRÁT MŮŽEME OHNOUT A ZMĚNIT JEHO TVAR.',air:'VZDUCH JE STLAČITELNÝ. PO UVOLNĚNÍ SE ROZPÍNÁ.'};document.getElementById('testNote').textContent=notes[b.dataset.test]});if(page===6)wireQuiz();}
function wireQuiz(){document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{let ok=b.dataset.ok==='1';b.classList.add(ok?'correct':'wrong');b.disabled=true;document.getElementById('feedback').textContent=ok?'SPRÁVNĚ!':'ZKUS TO JEŠTĚ JEDNOU.';if(ok){correct.add(quizIndex);document.querySelectorAll('[data-ok="0"]').forEach(x=>x.disabled=true);const n=document.getElementById('nextQuestion');n.hidden=false;n.onclick=()=>{quizIndex++;render()}}})}
render();
</script>
</body>
</html>
