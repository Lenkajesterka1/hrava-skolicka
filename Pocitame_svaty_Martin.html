 if(mode==='sub'){const total=rand(range);const removed=rand(total);document.getElementById('prompt').textContent='KOLIK ZŮSTANE?';equation.innerHTML=group(icon,total)+'<span class="operator">−</span>'+group(icon,removed)+'<span class="operator">=</span><span class="operator">?</span>';taskAnswer=total-removed;choices=numberChoices(taskAnswer)}
 if(mode==='compare'){const left=rand(range),right=rand(range);const other=pick(objects.filter(x=>x!==icon));document.getElementById('prompt').textContent='POROVNEJ POČTY. VYBER ZNAK.';equation.innerHTML='<div class="compare-layout"><div class="compare-box"><p class="compare-label">VLEVO</p>'+group(icon,left)+'</div><span class="operator">?</span><div class="compare-box"><p class="compare-label">VPRAVO</p>'+group(other,right)+'</div></div>';taskAnswer=left>right?'>':left<right?'<':'=';choices=['>','<','='].sort(()=>Math.random()-.5)}
 if(mode==='series'){const length=range<=5?4:5;const start=rand(range-length+1);const ascending=Math.random()<.5;const sequence=Array.from({length},(_,i)=>ascending?start+i:start+length-1-i);const missing=Math.floor(Math.random()*(length-2))+1;document.getElementById('prompt').textContent='DOPLŇ ČÍSELNOU ŘADU.';equation.innerHTML='<div class="sequence-row">'+sequence.map((n,i)=>'<span class="sequence-cell'+(i===missing?' missing':'')+'">'+(i===missing?'?':n)+'</span>').join('')+'</div>';taskAnswer=sequence[missing];choices=numberChoices(taskAnswer)}
 const box=document.getElementById('answers');box.innerHTML='';choices.forEach(value=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=value;if(mode==='compare')b.setAttribute('aria-label',({'>':'větší než','<':'menší než','=':'rovná se'})[value]);b.onclick=()=>checkAnswer(b,value);box.appendChild(b)})
}
function checkAnswer(button,value){if(button.dataset.done)return;button.dataset.done='1';if(value===taskAnswer){button.style.background='#d5efc6';button.style.borderColor='#70a448';document.getElementById('feedback').textContent='VÝBORNĚ! 🌟';correct++;document.getElementById('score').textContent='SPRÁVNĚ: '+correct}else{button.style.background='#ffd5ca';button.style.borderColor='#d66b50';document.getElementById('feedback').textContent='ZKUS TO ZNOVU. PODÍVEJ SE NA OBRÁZKY.'}}
document.querySelectorAll('#ranges .mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ranges .mode').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');range=Number(b.dataset.range);setQuestion()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;setQuestion()});document.getElementById('next').onclick=setQuestion;setQuestion();
</script></body></html>
