];const letters=['A','K','M','S','P','L','T','O','E','J','V','R','Z','N','U','H'];let step=0,solved=false;const area=document.getElementById('letters');letters.forEach((letter,i)=>{const col=i%4,row=Math.floor(i/4);const b=document.createElement('button');b.className='hot';b.style.left=(6.45+col*13.2)+'%';b.style.top=(35.55+row*13.22)+'%';b.style.width='12.2%';b.style.height='12.2%';b.setAttribute('aria-label','Písmeno '+letter);b.onclick=()=>choose(letter,b);area.appendChild(b)});function render(){solved=false;document.getElementById('title').innerHTML='NAJDI PÍSMENO <b>'+items[step].letter+'</b>';document.getElementById('counter').textContent='ÚKOL '+(step+1)+' / '+items.length;document.getElementById('result').classList.remove('show');document.getElementById('message').textContent='';document.getElementById('next').disabled=true;document.querySelectorAll('#letters button').forEach(b=>b.classList.remove('correct','wrong'));}function choose(letter,b){if(solved||!document.getElementById('intro').hidden)return;if(letter!==items[step].letter){b.classList.add('wrong');document.getElementById('message').textContent='ZKUS TO JEŠTĚ JEDNOU';setTimeout(()=>{b.classList.remove('wrong');if(!solved)document.getElementById('message').textContent=''},850);return;}solved=true;b.classList.add('correct');const item=items[step],photo=document.getElementById('photo');photo.src=item.image;photo.alt=item.word;document.getElementById('word').textContent=item.word;document.getElementById('result').classList.add('show');document.getElementById('message').textContent='';document.getElementById('next').disabled=false;}function advance(){if(!solved)return;if(step===items.length-1){document.getElementById('finish').classList.add('show');return;}step++;render()}function start(){document.getElementById('intro').hidden=true;render()}function home(){step=0;document.getElementById('finish').classList.remove('show');document.getElementById('intro').hidden=false;render()}render();</script></body></html>
