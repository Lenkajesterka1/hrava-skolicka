const board=document.getElementById('board'),piece=document.getElementById('piece'),pieceImage=document.getElementById('pieceImage'),die=document.getElementById('die'),status=document.getElementById('status'),taskBox=document.getElementById('task');
let selected=null,position=-1,rolling=false,dragging=false;
const faces={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(n){die.replaceChildren();for(let i=0;i<9;i++){const e=document.createElement('span');if(faces[n].includes(i))e.className='dot';die.append(e);}}
function showMessage(t){status.textContent=t;}
function place(n){position=Math.max(-1,Math.min(n,stations.length-1));const p=position===-1?{x:25,y:73}:stations[position];piece.style.left=p.x+'%';piece.style.top=p.y+'%';if(position===stations.length-1)showMessage('🏆 Výborně! Došli jste do cíle!');}
function choose(name){selected=name;pieceImage.src=animals[name];piece.style.display='block';piece.style.visibility='visible';document.querySelectorAll('.animal').forEach(b=>b.classList.toggle('chosen',b.dataset.animal===name));place(-1);showMessage('Zvířátko je na startu. Hoď kostkou a posuň ho sám.');}
document.querySelectorAll('.animal').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.animal)));
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function roll(){if(rolling)return;rolling=true;die.classList.add('shaking');showMessage('🎲 Kostka losuje…');for(let i=0;i<12;i++){drawDie(1+Math.floor(Math.random()*6));await sleep(70);}const n=1+Math.floor(Math.random()*6);drawDie(n);die.classList.remove('shaking');rolling=false;showMessage('🎲 Padlo '+n+'. '+(selected?'Posuň figurku sám o '+n+' políček.':'Vyber zvířátko vlevo.'));}
die.addEventListener('click',roll);document.getElementById('roll').addEventListener('click',roll);
function openTask(i){const s=stations[i];document.getElementById('taskLetter').textContent='PÍSMENO '+s.l;document.getElementById('taskEmoji').textContent=s.emoji;document.getElementById('taskWord').textContent=s.word;taskBox.hidden=false;}
document.getElementById('close').addEventListener('click',()=>taskBox.hidden=true);
stations.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.style.left=s.x+'%';b.style.top=s.y+'%';b.setAttribute('aria-label','Písmeno '+s.l);b.addEventListener('click',()=>{
 if(selected){place(i);showMessage('🐾 Figurka je na políčku '+s.l+'.');}
 openTask(i);
});board.append(b);});
function nearest(clientX,clientY){const r=board.getBoundingClientRect(),x=(clientX-r.left)/r.width*100,y=(clientY-r.top)/r.height*100;let nearestIndex=0,min=Infinity;stations.forEach((p,i)=>{const d=(x-p.x)**2+(y-p.y)**2;if(d<min){min=d;nearestIndex=i;}});return nearestIndex;}
piece.addEventListener('pointerdown',e=>{
 if(!selected)return;
 dragging=true;
 try{piece.setPointerCapture(e.pointerId);}catch(err){}
 e.preventDefault();
});
piece.addEventListener('pointermove',e=>{if(!dragging)return;const r=board.getBoundingClientRect();piece.style.left=Math.max(1,Math.min(99,(e.clientX-r.left)/r.width*100))+'%';piece.style.top=Math.max(1,Math.min(99,(e.clientY-r.top)/r.height*100))+'%';});
piece.addEventListener('pointerup',e=>{
 if(!dragging)return;
 dragging=false;
 const i=nearest(e.clientX,e.clientY);
 place(i);
 showMessage('🐾 Figurka je na políčku '+stations[i].l+'.');
});
piece.addEventListener('pointercancel',()=>{dragging=false;place(position);});
piece.addEventListener('keydown',e=>{
 if(!selected)return;
 if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();place(position+1);}
 if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();place(position-1);}
});
document.getElementById('step').addEventListener('click',()=>{if(!selected){showMessage('Nejdřív vyber zvířátko vlevo.');return;}place(position+1);showMessage('Figurka se posunula na políčko '+(position+1)+'.');});
document.getElementById('reset').addEventListener('click',()=>{taskBox.hidden=true;drawDie(5);if(selected)place(-1);showMessage('Nová hra. Vyber zvířátko, hoď kostkou a posuň figurku.');});
drawDie(5);
</script></body></html>
